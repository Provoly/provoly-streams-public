name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.adoc'
      - '*.txt'
      - 'docs'
      - 'ide-config'
      - '.github/**'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.adoc'
      - 'docs'
      - 'ide-config'
      - '*.txt'
      - '.github/**'

env:
  JAVA_VERSION: 21
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showDateTime=true -Djansi.force=true"
  MAVEN_CLI_OPTS: "-Dstyle.color=always --batch-mode --errors --show-version -DinstallAtEnd=true -Dno-format -DdeployAtEnd=true"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true


jobs:
  prepare:
    runs-on: provoly-runner
    outputs:
      modules: ${{ steps.changed_modules.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Run changed-files with dir_names
        id: changed_modules
        uses: tj-actions/changed-files@v44
        with:
          dir_names: "true"
      - name: Echo
        run: echo ${{ steps.changed_modules.outputs.changed }}

  build:
    strategy:
      matrix:
        modules: ${{needs.prepare.outputs.modules}}
    name: Build
    runs-on: provoly-runner
    needs:
      - prepare
    steps:
      - uses: actions/checkout@v4
      - name: Echo
        run: echo ${{ matrix.modules }}

