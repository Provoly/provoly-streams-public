
quarkus:
  kafka-streams:
    topics: equipment



"%dev":

  quarkus:
    log:
      category:
        "org.hibernate":
          level: INFO
        "io.quarkus.oidc":
          level: INFO
        "com.provoly":
          level: INFO
        "org.jboss.resteasy.reactive.server":
          level: DEBUG
        "WebApplicationException":
          level: DEBUG
        min-level: TRACE
      #console:
      #  format: "%d{HH:mm:ss} %-5p traceId=%X{traceId} parentId=%X{parentId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n"

    http:
      access-log:
        enabled: true
      port: 8089

"%prod":
  quarkus:
    kubernetes-config:
      enabled: true
      config-maps: stream-equipment-enriched
